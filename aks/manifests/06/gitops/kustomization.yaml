# GitOps: the desired state of payments-api in namespace gitops-payments, reconciled by Flux on AKS.
# Promotion is a commit that changes the digest below; rollback is reverting that commit.
# Only digests that passed the aks-deploy pipeline (tests, scan gate, Key Vault signature) are promoted here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitops-payments
resources:
  - ../../../../k8s/base/payments-api
labels:
  - pairs: { owner: payments-platform, delivered-by: flux }
    includeSelectors: false
images:
  - name: payments-api
    newName: acrregk8s1e1193.azurecr.io/payments-api
    digest: sha256:329c75f0ad69e9529968c716625625892f0e953b36314c2386882cc20656097e   # build 6bca1e2bfded-4

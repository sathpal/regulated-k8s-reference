# Delivery pipeline for both services: verify -> evidence -> end-to-end on kind -> publish, sign, attest.
# Pull requests run everything except publish. A push to main also publishes to GHCR by digest and signs
# keylessly with this workflow's OIDC identity, which is what policy/kyverno/prod verifies at admission.
name: delivery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true
env:
  REPO: ghcr.io/sathpal/regulated-k8s-reference
  KYVERNO_VERSION: v1.19.1
jobs:
  verify:
    name: Unit tests, manifests and policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: apps/payments-api/go.mod }
      - name: payments-api tests
        working-directory: apps/payments-api
        run: go vet ./... && go test -count=1 ./...
      - name: patient-api tests
        working-directory: apps/patient-api
        run: python3 -m unittest -v test_app
      - name: Render every overlay
        run: for o in k8s/overlays/*/; do echo "== $o"; kubectl kustomize "$o" > /dev/null; done
      - name: Kyverno policy tests
        run: |
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" | tar -xz kyverno
          ./kyverno test policy/kyverno

  evidence:
    name: Naive vs production image evidence
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Build both Dockerfiles for each app and scan them
        run: scripts/compare-images.sh

  e2e:
    name: End to end on kind
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Install kind
        run: go install sigs.k8s.io/kind@latest && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build, deploy, smoke test, admission refusals, failed release and rollback
        run: scripts/e2e-kind.sh

  publish:
    name: Publish, sign and attest (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [evidence, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless signing with this workflow's identity
    strategy:
      matrix:
        app: [payments-api, patient-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ env.REPO }}/${{ matrix.app }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3
      - name: Gate, sign and attest by digest
        env:
          IMAGE: ${{ env.REPO }}/${{ matrix.app }}@${{ steps.build.outputs.digest }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype "$IMAGE" --only-fixed --fail-on high
          syft "$IMAGE" -o spdx-json=sbom.spdx.json
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/delivery.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "### ${{ matrix.app }}: signed and attested" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Promote by setting this digest in k8s/overlays/*-prod (GitOps pull request)." >> "$GITHUB_STEP_SUMMARY"

# Lab 07: payments-api from k8s/base in its own namespace, by digest from the release images CI built, signed and
# published to GHCR. The namespace is labelled as regulated data, so the repo's admission policies
# (policy/kyverno/cluster) admit only images from ghcr.io/sathpal/regulated-k8s-reference or cgr.dev/chainguard.
#   kubectl apply -k aks/manifests/07/payments
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab-c-payments
resources:
  - namespace.yaml
  - ../../../../k8s/base/payments-api
  - allow-loadgen.yaml
labels:                 # lets the drain step select only this lab's pods on a shared cluster
  - pairs:
      lab: c
    includeSelectors: false
    includeTemplates: true
images:
  - name: payments-api
    newName: ghcr.io/sathpal/regulated-k8s-reference/payments-api
    digest: sha256:ff5e2e64bbe2544d8015b1fa0da152353cc34a75c480e457328b19afca3483dd   # release e3be349

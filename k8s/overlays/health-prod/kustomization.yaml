# Healthcare production: patient-api in its own PHI-scoped namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: health-records
resources:
  - namespace.yaml
  - ../../base/patient-api
labels:
  - pairs:
      owner: clinical-platform
      compliance-scope: hipaa
    includeSelectors: false
images:
  - name: patient-api
    newName: ghcr.io/sathpal/regulated-k8s-reference/patient-api
    newTag: "1.0.0"

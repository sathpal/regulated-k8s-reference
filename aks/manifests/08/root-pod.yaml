# Everything hardened except the user: asks for uid 0. Pod Security "restricted" refuses it.
apiVersion: v1
kind: Pod
metadata:
  name: root-pod
  namespace: lab-d-secure
spec:
  securityContext:
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: cgr.dev/chainguard/wolfi-base:latest
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

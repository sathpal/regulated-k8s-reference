# payments-api as a hardened pod. IMAGE is replaced when applied, so the same spec can run
# the signed build, an unsigned build and an image from another registry.
apiVersion: v1
kind: Pod
metadata:
  name: NAME
  namespace: lab-d-signed
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: IMAGE
      ports:
        - containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }
      readinessProbe:
        httpGet: { path: /readyz, port: 8080 }
        periodSeconds: 5

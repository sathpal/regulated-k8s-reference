# A small web server to test network policy against: Chainguard nginx listens on 8080 as uid 65532.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-d-net
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: nginx
          image: cgr.dev/chainguard/nginx:latest
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-d-net
spec:
  selector: { app: web }
  ports:
    - port: 8080
      targetPort: 8080
